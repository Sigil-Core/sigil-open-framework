name: Policy docs gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-docs-gate:
    name: Policy docs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - name: Verify current policy documentation
        run: |
          node scripts/generate-current-policy-capabilities.cjs --check
          node scripts/verify-current-policy-versions.cjs
          node scripts/verify-claude-shim-example.cjs
          node scripts/verify-claude-shim-example.test.cjs
          node scripts/verify-doc-links.cjs
