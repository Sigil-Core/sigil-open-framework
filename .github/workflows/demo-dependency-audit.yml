name: Demo dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-dependency-audit:
    name: Demo dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Pin and assert the package-manager contract
        run: |
          npm install --global npm@11.12.1
          test "$(node --version)" = v22.22.0
          test "$(npm --version)" = 11.12.1
          printf 'node=%s\nnpm=%s\nsha=%s\n' "$(node --version)" "$(npm --version)" "$GITHUB_SHA" > dependency-toolchain.txt
      - name: Clean install
        run: npm ci
      - name: Capture and validate npm audits
        run: |
          # The registry advisory endpoint can hang or return malformed JSON
          # (2026-09-04: a ~5-minute hang produced output with no
          # metadata.vulnerabilities.total, leaving main red on an endpoint
          # fault). Bound each call and retry only when the output is not a
          # well-formed audit report; a report with findings never retries.
          capture_audit() {
            out="$1"; shift
            for attempt in 1 2 3; do
              if [ "$attempt" -gt 1 ]; then sleep $(( (attempt - 1) * 30 )); fi
              set +e
              timeout 180 npm audit --json "$@" > "${out}.json" 2> "${out}.stderr"
              echo $? > "${out}.exit"
              set -e
              if node --input-type=module -e '
                import fs from "node:fs";
                const text = fs.readFileSync(process.argv[1], "utf8");
                const total = JSON.parse(text)?.metadata?.vulnerabilities?.total;
                process.exit(Number.isInteger(total) ? 0 : 1);
              ' "${out}.json" 2> /dev/null; then
                return 0
              fi
              echo "::warning::${out}: no numeric vulnerability total (attempt ${attempt}, exit $(cat "${out}.exit"))"
            done
            echo "AUDIT_ENDPOINT_FAULT: ${out} malformed after 3 bounded attempts -- npm advisory endpoint fault, not a dependency finding" >&2
            return 1
          }
          # Attempt both scopes before failing so the artifact retains the
          # evidence of each even when the first one faults.
          endpoint_fault=0
          capture_audit audit-full || endpoint_fault=1
          capture_audit audit-production --omit=dev || endpoint_fault=1
          if [ "$endpoint_fault" -ne 0 ]; then
            exit 1
          fi
          FULL_STATUS="$(cat audit-full.exit)" PRODUCTION_STATUS="$(cat audit-production.exit)" node --input-type=module -e '
            import fs from "node:fs";
            for (const [file, status] of [["audit-full.json", Number(process.env.FULL_STATUS)], ["audit-production.json", Number(process.env.PRODUCTION_STATUS)]]) {
              const text = fs.readFileSync(file, "utf8");
              if (!text.trim()) throw new Error(`${file} is empty`);
              const audit = JSON.parse(text);
              const total = audit?.metadata?.vulnerabilities?.total;
              if (!Number.isInteger(total)) throw new Error(`${file} has no numeric vulnerability total`);
              if (total !== 0) throw new Error(`${file} reports ${total} vulnerabilities`);
              if (status !== 0) throw new Error(`${file} exited ${status} despite zero findings`);
            }
          '
      - name: Verify package signatures
        run: npm audit signatures > audit-signatures.txt
      - name: Verify lockfile determinism and typecheck
        run: |
          shasum -a 256 package-lock.json > package-lock.before.sha256
          npm install --package-lock-only --ignore-scripts
          git -C .. diff --exit-code -- demo/package-lock.json
          shasum -a 256 package-lock.json > package-lock.after.sha256
          diff -u package-lock.before.sha256 package-lock.after.sha256
          npm run typecheck
      - name: Retain dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-dependency-audit-${{ github.sha }}
          path: |
            demo/dependency-toolchain.txt
            demo/audit-*.json
            demo/audit-*.stderr
            demo/audit-*.exit
            demo/audit-signatures.txt
            demo/package-lock.*.sha256
          if-no-files-found: warn
